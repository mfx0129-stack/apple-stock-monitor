name: Apple Store iPhone Stock Monitor

on:
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Discordテスト通知を送信する"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: apple-stock-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests curl_cffi

      - name: Run Apple Stock Monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_DISCORD: ${{ github.event_name == 'workflow_dispatch' && inputs.test_discord || '0' }}
        run: |
          python monitor.py

      - name: Save stock state
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -f stock_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock_state.json
            if git diff --cached --quiet; then
              echo "No stock state changes."
            else
              git commit -m "Update stock state"
              git push
            fi
          fi
